
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>机构教学老师工作台</title>
<style>
:root {
  --primary: #7ec8a0;
  --primary-light: #e8f5ee;
  --secondary: #8db5d6;
  --secondary-light: #eaf2f8;
  --bg: #faf9f6;
  --bg-body: #faf9f6;
  --bg-card: #ffffff;
  --card: #ffffff;
  --text: #3a3a3a;
  --text-light: #7a7a7a;
  --text-secondary: #7a7a7a;
  --border: #e8e4df;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
  --radius: 12px;
  --nav-width: 220px;
  --nav-collapsed: 60px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
#app { display:flex; min-height:100vh; }

/* 导航栏 */
.sidebar { width:var(--nav-width); background:linear-gradient(180deg, #f0f7f2 0%, #eaf2f8 100%); border-right:1px solid var(--border); display:flex; flex-direction:column; position:fixed; left:0; top:0; bottom:0; z-index:100; transition:width 0.3s; overflow:hidden; }
.sidebar.collapsed { width:var(--nav-collapsed); }
.sidebar-header { padding:20px 16px; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--border); }
.sidebar-header .logo { width:32px; height:32px; background:var(--primary); border-radius:8px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:18px; font-weight:bold; flex-shrink:0; }
.sidebar-header .title { font-size:15px; font-weight:600; white-space:nowrap; }
.sidebar.collapsed .title { display:none; }
.toggle-btn { margin-left:auto; background:none; border:none; cursor:pointer; font-size:18px; color:var(--text-light); padding:4px; flex-shrink:0; }
.sidebar.collapsed .toggle-btn { margin-left:0; }
.nav-menu { flex:1; padding:12px 8px; display:flex; flex-direction:column; gap:4px; overflow-y:auto; }
.nav-item { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px; cursor:pointer; transition:all 0.2s; color:var(--text); font-size:14px; white-space:nowrap; border:none; background:none; width:100%; text-align:left; }
.nav-item:hover { background:rgba(126,200,160,0.15); }
.nav-item.active { background:var(--primary); color:#fff; font-weight:600; }
.nav-item .icon { font-size:18px; flex-shrink:0; width:22px; text-align:center; }
.sidebar.collapsed .nav-item { justify-content:center; padding:10px 8px; }
.sidebar.collapsed .nav-label { display:none; }

/* 主内容 */
.main { margin-left:var(--nav-width); flex:1; min-width:0; transition:margin-left 0.3s; display:flex; flex-direction:column; }
.main.expanded { margin-left:var(--nav-collapsed); }
.page-header { padding:20px 28px 0; margin-bottom:8px; }
.page-header h1 { font-size:22px; font-weight:700; color:var(--text); }
.page-header .date-info { font-size:13px; color:var(--text-light); margin-top:4px; }
.page-content { padding:20px 28px 40px; flex:1; overflow-y:auto; }

/* 卡片 */
.card { background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px; transition:box-shadow 0.2s; }
.card:hover { box-shadow:0 4px 20px rgba(0,0,0,0.1); }

/* 记账台 */
.section-title { font-size:16px; font-weight:600; margin-bottom:16px; padding-bottom:8px; border-bottom:2px solid var(--primary-light); display:flex; align-items:center; gap:8px; }
.section-title::before { content:''; width:4px; height:18px; background:var(--primary); border-radius:2px; }
.course-cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:14px; margin-bottom:28px; }
.course-card { cursor:pointer; text-align:center; padding:20px 16px; }
.course-card .card-icon { font-size:28px; margin-bottom:8px; }
.course-card .card-label { font-size:14px; font-weight:600; margin-bottom:4px; }
.course-card .card-count { font-size:28px; font-weight:700; color:var(--primary); }
.course-card .card-sub { font-size:12px; color:var(--text-light); margin-top:2px; }
.reimburse-cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:14px; }
.reimburse-card { cursor:pointer; }
.reimburse-card .card-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.reimburse-card .card-label { font-size:14px; font-weight:600; }
.reimburse-card .card-amount { font-size:18px; font-weight:700; color:#e08b5a; }
.reimburse-card .card-detail { font-size:12px; color:var(--text-light); }

/* 弹窗/详情面板 */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.35); z-index:200; display:flex; align-items:center; justify-content:center; }
.modal { background:var(--card); border-radius:var(--radius); box-shadow:0 8px 40px rgba(0,0,0,0.15); width:90%; max-width:640px; max-height:80vh; display:flex; flex-direction:column; }
.modal-header { padding:16px 20px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
.modal-header h3 { font-size:16px; font-weight:600; }
.modal-close { background:none; border:none; font-size:22px; cursor:pointer; color:var(--text-light); padding:4px; line-height:1; }
.modal-body { padding:20px; overflow-y:auto; flex:1; }
.modal-footer { padding:12px 20px; border-top:1px solid var(--border); display:flex; gap:8px; justify-content:flex-end; }

/* 表格 */
table { width:100%; border-collapse:collapse; font-size:13px; }
th, td { padding:10px 12px; text-align:left; border-bottom:1px solid var(--border); }
th { background:var(--primary-light); font-weight:600; color:var(--text); white-space:nowrap; }
tr:hover td { background:#fafcfb; }

/* 按钮 */
.btn { padding:8px 16px; border-radius:6px; border:none; cursor:pointer; font-size:13px; font-weight:500; transition:all 0.2s; display:inline-flex; align-items:center; gap:4px; }
.btn-primary { background:var(--primary); color:#fff; }
.btn-primary:hover { background:#6ab88f; }
.btn-outline { background:#fff; border:1px solid var(--border); color:var(--text); }
.btn-outline:hover { border-color:var(--primary); color:var(--primary); }
.btn-danger { background:#fde8e8; color:#c53030; }
.btn-danger:hover { background:#fbd5d5; }
.btn-sm { padding:4px 10px; font-size:12px; }
.btn-group { display:flex; gap:6px; flex-wrap:wrap; }

/* 搜索/筛选栏 */
.toolbar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px; }
.toolbar input, .toolbar select { padding:8px 12px; border:1px solid var(--border); border-radius:6px; font-size:13px; background:#fff; color:var(--text); outline:none; }
.toolbar input:focus, .toolbar select:focus { border-color:var(--primary); }
.toolbar input { min-width:200px; }

/* 学习进度 */
.subject-cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:16px; }
.subject-card .subject-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
.subject-card .subject-name { font-size:15px; font-weight:600; }
.subject-card .subject-count { font-size:12px; color:var(--text-light); background:var(--primary-light); padding:2px 8px; border-radius:10px; }
.level-group { margin-bottom:10px; }
.level-title { font-size:13px; font-weight:600; color:var(--primary); margin-bottom:4px; }
.level-students { font-size:13px; color:var(--text); line-height:1.8; }
.student-link { color:var(--primary); text-decoration:none; font-weight:500; cursor:pointer; }
.student-link:hover { text-decoration:underline; color:#5ba878; }
.course-del-btn { background:none; border:none; color:#c53030; cursor:pointer; font-size:14px; font-weight:bold; padding:0 2px; line-height:1; vertical-align:middle; margin-left:2px; }
.course-del-btn:hover { color:#e53e3e; }
.course-add-row { margin-top:6px; display:flex; gap:6px; align-items:center; }
.course-add-row input { flex:1; padding:4px 8px; border:1px solid var(--border); border-radius:4px; font-size:12px; outline:none; }
.course-add-row input:focus { border-color:var(--primary); }

/* 表单 */
.form-group { margin-bottom:12px; }
.form-group label { display:block; font-size:12px; font-weight:600; color:var(--text-light); margin-bottom:4px; }
.form-group input, .form-group select { width:100%; padding:8px 12px; border:1px solid var(--border); border-radius:6px; font-size:13px; outline:none; }
.form-group input:focus, .form-group select:focus { border-color:var(--primary); }
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }

/* 响应式 */
@media (max-width:768px) {
  .sidebar { width:var(--nav-collapsed); }
  .sidebar .title, .sidebar .nav-label { display:none; }
  .sidebar .nav-item { justify-content:center; }
  .main { margin-left:var(--nav-collapsed); }
  .course-cards { grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); }
  .subject-cards { grid-template-columns:1fr; }
  .form-row { grid-template-columns:1fr; }
  .page-content { padding:14px 12px; }
}
@media (min-width:769px) and (max-width:1024px) {
  .course-cards { grid-template-columns:repeat(auto-fill, minmax(170px, 1fr)); }
}

/* 课程表 */
.schedule-toolbar { display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
.schedule-week-label { font-size:15px; font-weight:600; color:var(--text); }
.schedule-grid { display:grid; grid-template-columns:90px repeat(7, 1fr); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; background:var(--card); }
.schedule-corner { background:var(--primary-light); border-bottom:1px solid var(--border); border-right:1px solid var(--border); }
.schedule-header { text-align:center; padding:10px 4px; background:var(--primary-light); border-bottom:2px solid var(--primary); border-right:1px solid var(--border); }
.schedule-header.today { background:#d4edda; border-bottom-color:#28a745; }
.schedule-header:last-child { border-right:none; }
.schedule-dow { font-size:13px; font-weight:600; }
.schedule-date { font-size:12px; color:var(--text-light); }
.schedule-header.today .schedule-dow { color:#28a745; }
.schedule-time { padding:8px 6px; font-size:12px; font-weight:600; color:var(--text-light); background:#f8f9fa; border-right:1px solid var(--border); border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:center; white-space:nowrap; }
.schedule-cell { min-height:80px; padding:6px 4px; border-right:1px solid var(--border); border-bottom:1px solid var(--border); cursor:pointer; transition:background 0.15s; display:flex; flex-direction:column; gap:3px; }
.schedule-cell:last-child { border-right:none; }
.schedule-cell:hover { background:var(--primary-light); }
.schedule-course { border-radius:6px; padding:4px 6px; font-size:11px; line-height:1.4; cursor:pointer; transition:filter 0.15s; }
.schedule-course:hover { filter:brightness(0.92); }
.schedule-course .course-time { font-weight:600; display:block; }
.schedule-course .course-student { display:block; }
.schedule-course .course-type-tag { font-size:10px; background:rgba(255,255,255,0.7); border-radius:3px; padding:0 4px; }
.course-member { background:#c8e6c9; }
.course-contest { background:#ffe0b2; }
.course-holiday { background:#bbdefb; }
.course-outing { background:#e1bee7; }
.schedule-empty { font-size:11px; color:var(--text-light); text-align:center; padding:8px 0; }

/* 统计 */
.stats-toolbar { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
.stats-month-label { font-size:14px; font-weight:600; color:var(--text); min-width:80px; text-align:center; }
@media (max-width:768px) {
  .schedule-grid { grid-template-columns:60px repeat(7, 1fr); font-size:11px; }
  .schedule-header { padding:6px 2px; }
  .schedule-cell { min-height:60px; padding:3px 2px; }
  .schedule-course { padding:3px 4px; font-size:10px; }
}

/* ===== Todo清单 ===== */
.todo-wrap { max-width:600px; margin:0 auto; }
.todo-header { text-align:center; margin-bottom:24px; }
.todo-header h2 { font-size:24px; font-weight:700; color:var(--primary); }
.todo-header .todo-date { font-size:14px; color:var(--text-light); margin-top:4px; }

/* 输入区 */
.todo-input-row { display:flex; gap:10px; margin-bottom:20px; }
.todo-input-row input { flex:1; padding:10px 14px; border:2px solid var(--border); border-radius:var(--radius); font-size:15px; outline:none; transition:border-color 0.2s; background:var(--card); color:var(--text); }
.todo-input-row input:focus { border-color:var(--primary); }
.todo-input-row button { padding:10px 22px; background:var(--primary); color:#fff; border:none; border-radius:var(--radius); font-size:15px; font-weight:600; cursor:pointer; transition:all 0.2s; white-space:nowrap; }
.todo-input-row button:hover { background:#6ab88e; transform:translateY(-1px); box-shadow:0 4px 12px rgba(126,200,160,0.35); }
.todo-input-row button:active { transform:translateY(0); }

/* 筛选标签 */
.todo-filters { display:flex; gap:8px; margin-bottom:16px; justify-content:center; }
.todo-filters button { padding:6px 18px; border-radius:20px; border:1.5px solid var(--border); background:var(--card); color:var(--text); font-size:14px; cursor:pointer; transition:all 0.2s; }
.todo-filters button:hover { border-color:var(--primary); color:var(--primary); }
.todo-filters button.active { background:var(--primary); color:#fff; border-color:var(--primary); }

/* 任务列表 */
.todo-list { list-style:none; }
.todo-item { display:flex; align-items:center; gap:12px; padding:12px 14px; background:var(--card); border-radius:var(--radius); margin-bottom:8px; box-shadow:var(--shadow); transition:all 0.2s; }
.todo-item:hover { transform:translateX(4px); box-shadow:0 4px 18px rgba(0,0,0,0.1); }
.todo-item.completed .todo-text { text-decoration:line-through; color:#b0b0b0; }
.todo-check { width:20px; height:20px; border:2px solid #ccc; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all 0.2s; font-size:12px; color:transparent; }
.todo-check:hover { border-color:var(--primary); }
.todo-check.done { background:var(--primary); border-color:var(--primary); color:#fff; }
.todo-text { flex:1; font-size:15px; color:var(--text); word-break:break-word; transition:color 0.2s; }
.todo-item.completed .todo-text { color:#b0b0b0; }
.todo-actions { display:flex; gap:6px; flex-shrink:0; }
.todo-actions button { padding:4px 10px; border-radius:6px; border:1px solid var(--border); background:var(--card); font-size:13px; cursor:pointer; transition:all 0.15s; color:var(--text); }
.todo-actions .btn-edit:hover { border-color:var(--secondary); color:var(--secondary); background:var(--secondary-light); }
.todo-actions .btn-del:hover { border-color:#e07070; color:#e07070; background:#fef0f0; }

/* 底部统计 */
.todo-footer { display:flex; align-items:center; justify-content:space-between; margin-top:20px; padding-top:16px; border-top:1px solid var(--border); }
.todo-count { font-size:14px; color:var(--text-light); }
.todo-count strong { color:var(--primary); margin:0 4px; }
.todo-footer .btn-clear { padding:6px 14px; border-radius:6px; border:1px solid #e07070; background:#fff; color:#e07070; font-size:13px; cursor:pointer; transition:all 0.2s; }
.todo-footer .btn-clear:hover { background:#e07070; color:#fff; }
.todo-footer .btn-clear:disabled { border-color:#ddd; color:#ccc; cursor:default; background:#fff; }
.todo-empty { text-align:center; padding:40px 0; color:var(--text-light); font-size:15px; }

/* 侧边栏底部：数据导出/导入 */
.sidebar-footer { padding:12px 14px; border-top:1px solid rgba(255,255,255,0.15); margin-top:auto; }
.data-status { display:flex; align-items:center; gap:6px; font-size:11px; color:rgba(255,255,255,0.7); margin-bottom:8px; }
.data-status .status-dot { width:7px; height:7px; border-radius:50%; background:#7ec8a0; flex-shrink:0; }
.data-status.no-file .status-dot { background:#e0a060; }
.sidebar-footer .btn-data { display:block; width:100%; padding:8px 0; margin-bottom:6px; border:1px solid rgba(255,255,255,0.3); border-radius:8px; background:transparent; color:rgba(255,255,255,0.85); font-size:13px; cursor:pointer; transition:all 0.2s; text-align:center; }
.sidebar-footer .btn-data:hover { background:rgba(255,255,255,0.12); border-color:rgba(255,255,255,0.5); }
.sidebar-footer .btn-data:last-child { margin-bottom:0; }
.sidebar.collapsed .sidebar-footer { padding:8px 4px; }
.sidebar.collapsed .sidebar-footer .btn-data { font-size:11px; padding:6px 0; }
.sidebar.collapsed .data-status { justify-content:center; }
.sidebar.collapsed .data-status span:not(.status-dot) { display:none; }

/* ===== 提成管理 ===== */
.commission-cards {
  display: grid; grid-template-columns: 1fr;
  gap: 14px; margin-bottom: 16px;
}
.commission-cards .card-label {
  font-size: .85rem; font-weight: 600; color: var(--text);
  margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.commission-cards .card-amount {
  font-size: 1.5rem; font-weight: 700; color: var(--primary);
  margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.commission-cards .card-sub {
  font-size: .78rem; color: var(--text-secondary); line-height: 1.4;
}
.commission-card.chart-card {
  padding: 16px; display: flex; align-items: center; justify-content: center;
  min-height: 160px;
}
.canvas-bar-chart { width: 100%; height: 100%; min-height: 160px; }
.commission-actions { margin-top: 4px; margin-bottom: 8px; }
.commission-actions button {
  background: var(--primary); color: #fff; border: none;
  border-radius: 6px; padding: 8px 18px; cursor: pointer;
  font-size: .85rem; font-weight: 500;
  transition: opacity .2s;
}
.commission-actions button:hover { opacity: .85; }
.commission-detail-table { width: 100%; border-collapse: collapse; font-size: .85rem; }
.commission-detail-table th {
  background: var(--bg-body); padding: 10px 12px; text-align: left;
  border-bottom: 2px solid var(--border); font-weight: 600; white-space: nowrap;
}
.commission-detail-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
.commission-detail-table .btn-sm { padding: 3px 8px; font-size: .75rem; margin: 0 2px; }

/* ===== 提成管理 响应式 ===== */
@media (max-width: 860px) {
  .commission-card.chart-card { min-height: 200px; }
  .canvas-bar-chart { min-height: 200px; }
}
@media (max-width: 640px) {
  .commission-card.chart-card { padding: 14px 12px; }
  .commission-cards .card-amount { font-size: 1.25rem; }
  .modal { max-width: 95%; max-height: 90vh; }
  .modal-header { padding: 12px 14px; }
  .modal-body { padding: 12px; overflow-x: auto; }
  .modal-footer { padding: 10px 14px; }
  .commission-detail-table { min-width: 500px; }
}

/* ===== 登录覆盖层 ===== */
.login-overlay {
  position: fixed; inset: 0; z-index: 9999;
  background: linear-gradient(135deg, #e8f5ee 0%, #eaf2f8 50%, #f0f7f2 100%);
  display: flex; align-items: center; justify-content: center;
}
.login-box {
  background: #fff; border-radius: 16px; box-shadow: 0 8px 40px rgba(0,0,0,0.12);
  padding: 40px 36px; width: 380px; max-width: 90vw;
}
.login-box h2 { text-align: center; margin-bottom: 8px; font-size: 22px; color: var(--text); }
.login-box .login-subtitle { text-align: center; font-size: 13px; color: var(--text-light); margin-bottom: 28px; }
.login-box .form-group { margin-bottom: 16px; }
.login-box .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
.login-box .form-group input {
  width: 100%; padding: 10px 14px; border: 2px solid var(--border); border-radius: 8px;
  font-size: 14px; outline: none; transition: border-color 0.2s;
}
.login-box .form-group input:focus { border-color: var(--primary); }
.login-box .btn-login {
  width: 100%; padding: 12px; background: var(--primary); color: #fff; border: none;
  border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 4px;
  transition: background 0.2s;
}
.login-box .btn-login:hover { background: #6ab88f; }
.login-box .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }
.login-box .login-error {
  color: #c53030; font-size: 13px; text-align: center; margin-top: 12px; min-height: 20px;
}

/* ===== 账号管理 ===== */
.account-toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
.account-info { margin-bottom: 16px; padding: 10px 14px; background: var(--primary-light); border-radius: 8px; font-size: 13px; display: flex; align-items: center; }
.account-info strong { color: var(--primary); }
</style>
</head>
<body>
<div id="loading" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#faf9f6;z-index:9999;font-size:16px;color:#7a7a7a;font-family:sans-serif;">正在加载教师工作台...</div>
<script src="vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>window.onerror=function(m){document.getElementById('loading').innerHTML='<div style="text-align:center;color:#c53030;"><p>加载失败</p><p style="font-size:13px;">'+m+'</p></div>';};</script>
<div id="app"></div>
<script type="text/x-template" id="app-tpl">
  <!-- ==================== 登录覆盖层 ==================== -->
  <div v-if="!isLoggedIn" class="login-overlay">
    <div class="login-box">
      <h2>教师工作台</h2>
      <p class="login-subtitle">请输入账号密码登录</p>
      <div class="form-group">
        <label>账号</label>
        <input type="text" v-model="loginForm.username" @keyup.enter="handleLogin" placeholder="请输入账号" autocomplete="username" />
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" v-model="loginForm.password" @keyup.enter="handleLogin" placeholder="请输入密码" autocomplete="current-password" />
      </div>
      <button class="btn-login" @click="handleLogin" :disabled="loginLoading">
        {{ loginLoading ? '登录中...' : '登 录' }}
      </button>
      <div class="login-error">{{ loginError }}</div>
    </div>
  </div>

  <!-- 侧边栏 -->
  <nav v-if="isLoggedIn" :class="['sidebar', { collapsed: sidebarCollapsed }]">
    <div class="sidebar-header">
      <div class="logo">T</div>
      <span class="title">教师工作台</span>
      <button class="toggle-btn" @click="sidebarCollapsed=!sidebarCollapsed">☰</button>
    </div>
    <div class="nav-menu">
      <button v-for="item in navItems" :key="item.key"
        :class="['nav-item', { active: currentPage === item.key }]"
        @click="currentPage = item.key">
        <span class="icon">{{ item.icon }}</span>
        <span class="nav-label">{{ item.label }}</span>
      </button>
    </div>
    <!-- 数据文件管理 -->
    <div class="sidebar-footer">
      <div class="data-status" v-if="dataFromFile" title="数据自动同步到 teacher-workbench-data.json">
        <span class="status-dot"></span>文件同步中
      </div>
      <div class="data-status no-file" v-else title="当前使用浏览器本地存储">
        <span class="status-dot"></span>未配置文件
      </div>
      <button class="btn-data" @click="setupDataFileHandler">{{ dataFromFile ? '更换数据文件' : '设置数据文件' }}</button>
      <button class="btn-data" @click="exportData">导出备份</button>
    </div>
  </nav>

  <!-- 主内容 -->
  <div v-if="isLoggedIn" :class="['main', { expanded: sidebarCollapsed }]">
    <div class="page-header">
      <div style="display:flex; justify-content:space-between; align-items:flex-start;">
        <div>
          <h1>{{ currentNav.label }}</h1>
          <div class="date-info">{{ todayStr }} · {{ weekdayStr }}</div>
        </div>
        <button class="btn btn-outline btn-sm" @click="handleLogout" style="margin-top:4px;">退出登录</button>
      </div>
    </div>
    <div class="page-content">

      <!-- ==================== 记账台 ==================== -->
      <div v-if="currentPage==='ledger'">
        <!-- 机构课时 -->
        <div class="section-title">机构课时</div>
        <div class="stats-toolbar">
          <button class="btn btn-outline btn-sm" @click="prevCourseViewDate">&lt;</button>
          <span class="stats-month-label">{{ courseViewDateLabel }}</span>
          <button class="btn btn-outline btn-sm" @click="nextCourseViewDate">&gt;</button>
          <button class="btn btn-outline btn-sm" @click="goTodayCourseView">今天</button>
        </div>
        <div class="course-cards">
          <div class="card course-card" v-for="c in courseTypes" :key="c.key" @click="openCourseDetail(c)">
            <div class="card-icon">{{ c.icon }}</div>
            <div class="card-label">{{ c.label }}</div>
            <div class="card-count">{{ getCourseCountByDate(c.key) }} 人</div>
            <div class="card-sub">{{ courseViewDateLabel }}</div>
          </div>
        </div>

        <!-- 本月统计 -->
        <div class="section-title">本月统计</div>
        <div class="stats-toolbar">
          <button class="btn btn-outline btn-sm" @click="prevStatsMonth">&lt;</button>
          <span class="stats-month-label">{{ statsMonthLabel }}</span>
          <button class="btn btn-outline btn-sm" @click="nextStatsMonth">&gt;</button>
          <button class="btn btn-outline btn-sm" @click="goCurrentStatsMonth">本月</button>
        </div>
        <div class="course-cards">
          <div class="card course-card" @click="openMonthStats">
            <div class="card-icon">👨‍🎓</div>
            <div class="card-label">本月上课学员</div>
            <div class="card-count">{{ monthlyStudentCount }} 人</div>
            <div class="card-sub">{{ statsMonthLabel }} · {{ monthlyCoursesForStats.length }} 节课</div>
          </div>
        </div>

        <!-- 餐补与报销 -->
        <div class="section-title">餐补与报销</div>
        <div class="stats-toolbar">
          <button class="btn btn-outline btn-sm" @click="prevReimburseMonth">&lt;</button>
          <span class="stats-month-label">{{ reimburseMonthLabel }}</span>
          <button class="btn btn-outline btn-sm" @click="nextReimburseMonth">&gt;</button>
          <button class="btn btn-outline btn-sm" @click="goCurrentReimburseMonth">本月</button>
        </div>
        <div class="reimburse-cards">
          <div class="card reimburse-card" @click="openMealDetail">
            <div class="card-header">
              <span class="card-label">餐补</span>
              <span class="card-amount">¥{{ mealViewMonthTotal }}</span>
            </div>
            <div class="card-detail">{{ reimburseMonthLabel }} · {{ mealsByViewMonth.length }} 条记录</div>
          </div>
          <div class="card reimburse-card" @click="openReimburseDetail">
            <div class="card-header">
              <span class="card-label">报销</span>
              <span class="card-amount">¥{{ reimburseViewMonthTotal }}</span>
            </div>
            <div class="card-detail">{{ reimbursementsByViewMonth.filter(r=>r.status==='待审批').length }} 条待审批</div>
          </div>
        </div>
      </div>

      <!-- ==================== Todo清单 ==================== -->
      <div v-if="currentPage==='todo'">
        <div class="todo-wrap">
          <!-- 顶部：标题 + 日期 -->
          <div class="todo-header">
            <h2>📝 Todo 清单</h2>
            <div class="todo-date">{{ todoDateLabel }}</div>
          </div>

          <!-- 输入框 + 添加按钮 -->
          <div class="todo-input-row">
            <input
              v-model="todoInput"
              @keyup.enter="addTodo"
              placeholder="写一条待办事项…"
              maxlength="100"
            />
            <button @click="addTodo">添加</button>
          </div>

          <!-- 筛选标签 -->
          <div class="todo-filters">
            <button
              v-for="f in todoFilters"
              :key="f.key"
              :class="{ active: todoFilterKey === f.key }"
              @click="todoFilterKey = f.key"
            >{{ f.label }}</button>
          </div>

          <!-- 任务列表 -->
          <ul v-if="filteredTodos.length" class="todo-list">
            <li
              v-for="t in filteredTodos"
              :key="t.id"
              :class="['todo-item', { completed: t.done }]"
            >
              <!-- 完成复选框 -->
              <span
                :class="['todo-check', { done: t.done }]"
                @click="toggleTodo(t)"
              >✓</span>

              <!-- 任务文字（编辑模式显示输入框） -->
              <input
                v-if="editingTodoId===t.id"
                v-model="editTodoText"
                @keyup.enter="saveEditTodo(t)"
                @keyup.escape="cancelEditTodo"
                @blur="saveEditTodo(t)"
                class="todo-text"
                style="border:1px solid var(--primary); border-radius:6px; padding:4px 8px; outline:none; flex:1;"
                ref="todoEditInput"
              />
              <span v-else class="todo-text">{{ t.text }}</span>

              <!-- 编辑 / 删除按钮 -->
              <div class="todo-actions">
                <button class="btn-edit" @click="startEditTodo(t)">编辑</button>
                <button class="btn-del" @click="deleteTodo(t.id)">删除</button>
              </div>
            </li>
          </ul>

          <!-- 空状态 -->
          <div v-else class="todo-empty">
            {{ todoFilterKey === 'all' ? '暂无待办，添加一条吧' : todoFilterKey === 'active' ? '没有未完成的任务 ✓' : '没有已完成的任务' }}
          </div>

          <!-- 底部统计 -->
          <div v-if="teacherData.todos.length" class="todo-footer">
            <span class="todo-count">
              剩余 <strong>{{ activeTodoCount }}</strong> 项待办
            </span>
            <button
              class="btn-clear"
              :disabled="completedTodoCount === 0"
              @click="clearCompletedTodos"
            >清除已完成 ({{ completedTodoCount }})</button>
          </div>
        </div>
      </div>

      <!-- ==================== 课程表 ==================== -->
      <div v-if="currentPage==='schedule'">
        <div class="schedule-toolbar">
          <button class="btn btn-outline btn-sm" @click="prevWeek">&lt; 上一周</button>
          <span class="schedule-week-label">{{ weekLabel }}</span>
          <button class="btn btn-outline btn-sm" @click="nextWeek">下一周 &gt;</button>
          <button class="btn btn-outline btn-sm" @click="goCurrentWeek">本周</button>
        </div>
        <div class="schedule-grid">
          <!-- 表头：星期+日期 -->
          <div class="schedule-corner"></div>
          <div v-for="d in weekDays" :key="d.date" :class="['schedule-header', { today: d.isToday }]">
            <div class="schedule-dow">{{ d.dayOfWeek }}</div>
            <div class="schedule-date">{{ d.month }}/{{ d.day }}</div>
          </div>
          <!-- 时间块行 -->
          <template v-for="block in timeBlocks" :key="block.label">
            <div class="schedule-time">{{ block.label }}</div>
            <div v-for="d in weekDays" :key="d.date" class="schedule-cell" @click="addCourseFromSchedule(d.date)">
              <div v-for="c in getCoursesByDateBlock(d.date, block)" :key="c.id"
                class="schedule-course" :class="'course-'+c.type"
                @click.stop="editCourse(c)">
                <span class="course-time">{{ c.time }}</span>
                <span class="course-student">{{ c.studentName }}</span>
                <span class="course-type-tag">{{ getCourseTypeLabel(c.type) }}</span>
              </div>
              <div v-if="getCoursesByDateBlock(d.date, block).length===0" class="schedule-empty">+ 添加</div>
            </div>
          </template>
        </div>
      </div>

      <!-- ==================== 学生管理 ==================== -->
      <div v-if="currentPage==='students'">
        <!-- 子标签页 -->
        <div class="btn-group" style="margin-bottom:16px;">
          <button :class="['btn', studentTab==='roster' ? 'btn-primary' : 'btn-outline']" @click="studentTab='roster'">花名册</button>
          <button :class="['btn', studentTab==='progress' ? 'btn-primary' : 'btn-outline']" @click="studentTab='progress'">学习进度</button>
        </div>

        <!-- 花名册 -->
        <div v-if="studentTab==='roster'">
          <div class="toolbar">
            <input type="text" v-model="rosterSearch" placeholder="搜索姓名 / 学号...">
            <select v-model="rosterGenderFilter">
              <option value="">全部性别</option><option value="男">男</option><option value="女">女</option>
            </select>
            <select v-model="rosterSort">
              <option value="id">按学号排序</option><option value="name">按姓名排序</option>
            </select>
            <button class="btn btn-outline btn-sm" @click="viewMode = viewMode==='table' ? 'card' : 'table'">
              {{ viewMode==='table' ? '卡片视图' : '表格视图' }}
            </button>
            <button class="btn btn-primary btn-sm" @click="openRosterAdd">+ 新增学生</button>
          </div>

          <!-- 表格视图 -->
          <div v-if="viewMode==='table'" class="card" style="overflow-x:auto;">
            <table>
              <thead>
                <tr>
                  <th>学号</th><th>姓名</th><th>性别</th><th>出生日期</th>
                  <th>家长姓名</th><th>联系电话</th><th>家庭住址</th><th>备注</th><th>操作</th>
                </tr>
              </thead>
              <tbody>
                <tr v-for="s in filteredRoster" :key="s.id">
                  <td>{{ s.id }}</td><td>{{ s.name }}</td><td>{{ s.gender }}</td><td>{{ s.birth }}</td>
                  <td>{{ s.parent }}</td><td>{{ s.phone }}</td><td>{{ s.address }}</td><td>{{ s.note }}</td>
                  <td>
                    <button class="btn btn-outline btn-sm" @click="openRosterEdit(s)">编辑</button>
                    <button class="btn btn-danger btn-sm" @click="deleteRoster(s.id)">删除</button>
                  </td>
                </tr>
              </tbody>
            </table>
            <div v-if="filteredRoster.length===0" style="text-align:center;padding:30px;color:var(--text-light);">暂无数据</div>
          </div>

          <!-- 卡片视图 -->
          <div v-if="viewMode==='card'" style="display:grid;grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));gap:14px;">
            <div class="card" v-for="s in filteredRoster" :key="s.id">
              <div style="display:flex;justify-content:space-between;align-items:start;">
                <div>
                  <strong>{{ s.name }}</strong>
                  <span style="font-size:12px;color:var(--text-light);margin-left:8px;">{{ s.id }}</span>
                </div>
                <span style="font-size:12px;color:var(--text-light);">{{ s.gender }}</span>
              </div>
              <div style="font-size:12px;color:var(--text-light);margin-top:6px;">
                <div>出生：{{ s.birth }}</div>
                <div>家长：{{ s.parent }} · {{ s.phone }}</div>
                <div>地址：{{ s.address }}</div>
                <div v-if="s.note">备注：{{ s.note }}</div>
              </div>
              <div style="margin-top:10px;display:flex;gap:6px;">
                <button class="btn btn-outline btn-sm" @click="openRosterEdit(s)">编辑</button>
                <button class="btn btn-danger btn-sm" @click="deleteRoster(s.id)">删除</button>
              </div>
            </div>
          </div>
        </div>

        <!-- 学习进度 -->
        <div v-if="studentTab==='progress'">
          <div style="margin-bottom:14px;">
            <button class="btn btn-primary btn-sm" @click="openProgressAdd">+ 新增进度记录</button>
          </div>
          <div class="subject-cards">
            <div class="card subject-card" v-for="subj in subjects" :key="subj">
              <div class="subject-header">
                <span class="subject-name">{{ subj }}</span>
                <span class="subject-count">{{ getSubjectStudentCount(subj) }} 人</span>
              </div>
              <div class="level-group" v-for="lv in getSubjectLevels(subj)" :key="lv">
                <div class="level-title">{{ lv }}</div>
                <div class="level-students">
                  <span v-for="(p, i) in getProgressBySubjectLevel(subj, lv)" :key="p.id">
                    <a href="#" class="student-link" @click.prevent="openStudentDetail(p.studentName)">{{ p.studentName }}</a> {{ p.age }}岁<span v-if="i < getProgressBySubjectLevel(subj, lv).length - 1">、</span>
                  </span>
                  <span v-if="getProgressBySubjectLevel(subj, lv).length===0" style="color:var(--text-light);">—</span>
                </div>
              </div>
              <div style="margin-top:6px;">
                <button class="btn btn-outline btn-sm" @click="openProgressEditForSubject(subj)">编辑</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- ==================== 提成管理 ==================== -->
      <div v-if="currentPage==='commission'">
        <!-- 月份选择器 -->
        <div class="toolbar">
          <span style="font-weight:600;">📅 查看月份</span>
          <button class="btn btn-outline btn-sm" @click="prevCommissionMonth">&larr;</button>
          <span style="font-weight:600;min-width:80px;text-align:center;">{{ commissionMonthLabel }}</span>
          <button class="btn btn-outline btn-sm" @click="nextCommissionMonth">&rarr;</button>
          <button class="btn btn-outline btn-sm" @click="goCurrentCommissionMonth">本月</button>
        </div>

        <!-- 体验课提成 -->
        <div style="margin-bottom:24px;">
          <div class="section-title">体验课提成</div>
          <div class="commission-cards">
            <div class="card" @click="openCommissionDetail('trial','month')" style="cursor:pointer;">
              <div class="card-label">按月汇总</div>
              <div class="card-amount">¥{{ trialMonthTotal }}</div>
              <div class="card-sub">{{ trialMonthRecords.length }} 条记录 / {{ commissionMonthLabel }}</div>
            </div>
            <div class="card" @click="openCommissionDetail('trial','all')" style="cursor:pointer;">
              <div class="card-label">全部汇总</div>
              <div class="card-amount">¥{{ trialAllTotal }}</div>
              <div class="card-sub">{{ teacherData.trialCommissions.length }} 条累计记录</div>
            </div>
          </div>
          <div class="commission-actions" style="margin-top:8px;">
            <button @click="openCommissionEdit('trial')">+ 新增体验课提成</button>
          </div>
        </div>

        <!-- 新招或续费提成 -->
        <div style="margin-bottom:24px;">
          <div class="section-title">新招 / 续费提成</div>
          <div class="commission-cards">
            <div class="card" @click="openCommissionDetail('enrollment','month')" style="cursor:pointer;">
              <div class="card-label">按月汇总</div>
              <div class="card-amount">¥{{ enrollmentMonthTotal }}</div>
              <div class="card-sub">{{ enrollmentMonthRecords.length }} 条记录 / {{ commissionMonthLabel }}</div>
            </div>
            <div class="card" @click="openCommissionDetail('enrollment','all')" style="cursor:pointer;">
              <div class="card-label">全部汇总</div>
              <div class="card-amount">¥{{ enrollmentAllTotal }}</div>
              <div class="card-sub">{{ teacherData.enrollmentCommissions.length }} 条累计记录</div>
            </div>
          </div>
          <div class="commission-actions" style="margin-top:8px;">
            <button @click="openCommissionEdit('enrollment')">+ 新增招 / 续费提成</button>
          </div>
        </div>

        <!-- 提成汇总 -->
        <div style="margin-bottom:24px;">
          <div class="section-title">提成汇总</div>
          <div class="commission-cards">
            <div class="card" @click="openCommissionDetail('all','all')" style="cursor:pointer;">
              <div class="card-label">全部汇总</div>
              <div class="card-amount">¥{{ allCommissionTotal }}</div>
              <div class="card-sub">{{ allCommissionRecords.length }} 条累计记录</div>
            </div>
            <div class="card" @click="openCommissionDetail('all','month')" style="cursor:pointer;">
              <div class="card-label">按月汇总</div>
              <div class="card-amount">¥{{ allCommissionMonthTotal }}</div>
              <div class="card-sub">{{ allCommissionMonthRecords.length }} 条记录 / {{ commissionMonthLabel }}</div>
            </div>
            <div class="card commission-card chart-card" @click="openCommissionDetail('all','month')">
              <canvas ref="commissionChartRef" class="canvas-bar-chart"></canvas>
            </div>
          </div>
          <div class="commission-actions" style="margin-top:8px;">
            <button @click="openCommissionEdit('all')">+ 新增提成记录</button>
          </div>
        </div>

        <!-- 详情弹窗 -->
        <div class="modal-overlay" v-if="commDetail.show" @click.self="commDetail.show=false">
          <div class="modal">
            <div class="modal-header">
              <h3>{{ commDetail.title }}</h3>
              <button class="modal-close" @click="commDetail.show=false">&times;</button>
            </div>
            <div class="modal-body" style="max-height:50vh;overflow-y:auto;">
              <table class="commission-detail-table" v-if="commDetail.records.length">
                <thead>
                  <tr>
                    <th>月份</th><th>学生姓名</th><th>课包金额</th><th>提成金额</th><th>类别</th><th>操作</th>
                  </tr>
                </thead>
                <tbody>
                  <tr v-for="r in commDetail.records" :key="r.id">
                    <td>{{ r.month }}</td>
                    <td>{{ r.studentName }}</td>
                    <td>¥{{ r.packageAmount }}</td>
                    <td>¥{{ r.commissionAmount }}</td>
                    <td>{{ r.type==='trial'?'体验课':'招/续费' }}</td>
                    <td>
                      <button class="btn btn-outline btn-sm" @click="editCommissionFromDetail(r)">编辑</button>
                      <button class="btn btn-danger btn-sm" @click="deleteCommission(r.id)">删除</button>
                    </td>
                  </tr>
                </tbody>
              </table>
              <div v-else style="text-align:center;color:var(--text-secondary);padding:24px;">暂无提成记录</div>
            </div>
          </div>
        </div>

        <!-- 编辑弹窗 -->
        <div class="modal-overlay" v-if="commEdit.show" @click.self="commEdit.show=false">
          <div class="modal">
            <div class="modal-header">
              <h3>{{ commEdit.id ? '编辑提成' : '新增提成' }}</h3>
              <button class="modal-close" @click="commEdit.show=false">&times;</button>
            </div>
            <div class="modal-body">
              <div class="form-group" v-if="commEdit.type==='all'">
                <label>提成类别</label>
                <select v-model="commEdit.recordType" class="input">
                  <option value="trial">体验课提成</option>
                  <option value="enrollment">新招 / 续费提成</option>
                </select>
              </div>
              <div class="form-group">
                <label>月份</label>
                <input type="month" v-model="commEdit.month" class="input" />
              </div>
              <div class="form-group">
                <label>学生姓名</label>
                <input type="text" v-model="commEdit.studentName" class="input" placeholder="请输入学生姓名" />
              </div>
              <div class="form-group">
                <label>课包金额</label>
                <input type="number" v-model.number="commEdit.packageAmount" class="input" placeholder="0" min="0" />
              </div>
              <div class="form-group">
                <label>提成金额</label>
                <input type="number" v-model.number="commEdit.commissionAmount" class="input" placeholder="0" min="0" />
              </div>
            </div>
            <div class="modal-footer">
              <button class="btn btn-outline" @click="commEdit.show=false">取消</button>
              <button class="btn btn-primary" @click="saveCommission">保存</button>
            </div>
          </div>
        </div>
      </div>

      <!-- ==================== 账号管理 ==================== -->
      <div v-if="currentPage==='accounts'">
        <div class="account-info">
          当前登录：<strong>{{ currentUser?.username }}</strong>
          <button class="btn btn-outline btn-sm" @click="handleLogout" style="margin-left:16px;">退出登录</button>
        </div>
        <div class="account-toolbar">
          <button class="btn btn-primary btn-sm" @click="openAddAccount" v-if="currentUser && currentUser.username==='admin'">+ 新增账号</button>
          <button class="btn btn-outline btn-sm" @click="loadUsers" v-if="currentUser && currentUser.username==='admin'">刷新列表</button>
        </div>
        <div class="card" style="overflow-x:auto;">
          <table v-if="filteredUsers.length">
            <thead>
              <tr><th>ID</th><th>用户名</th><th>角色</th><th>创建时间</th><th>操作</th></tr>
            </thead>

<script>
const { createApp, ref, computed, watch, onMounted } = Vue;

const STORAGE_KEY_PREFIX = 'teacher_workbench_data_v2';
const DATA_FILE_NAME = 'teacher-workbench-data.json';
let _currentUsername = null;
function getStorageKey() { return _currentUsername ? `${STORAGE_KEY_PREFIX}_${_currentUsername}` : STORAGE_KEY_PREFIX; }

/* ===== Supabase 客户端初始化 ===== */
const supabaseClient = window.supabase.createClient(
  'https://yqwohebgkihihnvhsdyl.supabase.co',
  'sb_publishable_1qu8shsDsmeEeXLo1PugqA_2XI2VKZy'
);

/* ===== IndexedDB：持久化文件句柄 ===== */
const DB_NAME = 'TeacherWorkbenchDB';
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = (e) => { e.target.result.createObjectStore('handles'); };
    req.onsuccess = (e) => resolve(e.target.result);
    req.onerror = () => reject(req.error);
  });
}
async function storeFileHandle(handle) {
  const db = await openDB();
  return new Promise((resolve) => {
    const tx = db.transaction('handles', 'readwrite');
    tx.objectStore('handles').put(handle, 'dataFile');
    tx.oncomplete = () => resolve();
  });
}
async function getStoredFileHandle() {
  try {
    const db = await openDB();
    return new Promise((resolve) => {
      const tx = db.transaction('handles', 'readonly');
      const req = tx.objectStore('handles').get('dataFile');
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => resolve(null);
    });
  } catch(e) { return null; }
}

/* ===== 数据加载（Supabase 优先 → localStorage 兜底 → 文件兜底） ===== */
async function loadData() {
  const defaults = {
    courses: [], meals: [], reimbursements: [], roster: [], progresses: [], todos: [],
    trialCommissions: [], enrollmentCommissions: []
  };

  // 1. 优先从 Supabase 加载
  let supabaseData = null;
  const dataId = _currentUsername || 'default';
  try {
    const { data: row, error } = await supabaseClient
      .from('workbench_data')
      .select('data')
      .eq('id', dataId)
      .single();
    if (!error && row && row.data) {
      supabaseData = row.data;
      for (const key of Object.keys(defaults)) {
        if (!(key in supabaseData)) supabaseData[key] = defaults[key];
      }
    }
  } catch(e) { /* Supabase 不可用，继续回退 */ }

  // 2. 从 localStorage 读取
  let localData = null;
  try {
    const raw = localStorage.getItem(getStorageKey());
    if (raw) {
      localData = JSON.parse(raw);
      for (const key of Object.keys(defaults)) {
        if (!(key in localData)) localData[key] = defaults[key];
      }
    }
  } catch(e) {}

  // 3. 数据合并：使用较新数据（基于 _updatedAt 时间戳）
  let result = null;
  if (supabaseData && localData) {
    const supabaseTime = supabaseData._updatedAt || 0;
    const localTime = localData._updatedAt || 0;
    result = supabaseTime >= localTime ? supabaseData : localData;
  } else if (supabaseData) {
    result = supabaseData;
  } else if (localData) {
    result = localData;
  }

  if (result) {
    // 同步到 localStorage
    localStorage.setItem(getStorageKey(), JSON.stringify(result));
    return { data: result, fromFile: false };
  }

  // 4. 文件兜底
  const handle = await getStoredFileHandle();
  if (handle) {
    try {
      const perm = await handle.queryPermission({ mode: 'readwrite' });
      if (perm !== 'granted') {
        const req = await handle.requestPermission({ mode: 'readwrite' });
        if (req !== 'granted') throw new Error('无权限');
      }
      const file = await handle.getFile();
      const parsed = JSON.parse(await file.text());
      for (const key of Object.keys(defaults)) {
        if (!(key in parsed)) parsed[key] = defaults[key];
      }
      // 同步到 localStorage
      localStorage.setItem(getStorageKey(), JSON.stringify(parsed));
      return { data: parsed, fromFile: true };
    } catch(e) { /* 文件读取失败 → 回退默认值 */ }
  }

  return { data: defaults, fromFile: false };
}

/* ===== 数据保存（localStorage + Supabase + 文件三写） ===== */
async function saveDataToFile(data) {
  // 添加更新时间戳
  data._updatedAt = Date.now();
  // 写入 localStorage（离线兜底）
  localStorage.setItem(getStorageKey(), JSON.stringify(data));
  // 异步写入 Supabase（不阻塞 UI）
  const dataId = _currentUsername || 'default';
  try {
    await supabaseClient.from('workbench_data').upsert({ id: dataId, data: data });
  } catch(e) { /* Supabase 不可用时静默失败 */ }
  // 文件写入（保留原有逻辑）
  const handle = await getStoredFileHandle();
  if (handle) {
    try {
      const perm = await handle.queryPermission({ mode: 'readwrite' });
      if (perm === 'granted') {
        const writable = await handle.createWritable();
        await writable.write(JSON.stringify(data, null, 2));
        await writable.close();
      }
    } catch(e) { /* 静默失败，localStorage 已有数据 */ }
  }
}

/* ===== 设置数据文件（用户手动触发） ===== */
async function setupDataFile(dataObj) {
  if (!window.showSaveFilePicker) {
    alert('当前浏览器不支持文件系统 API，请使用 Chrome 或 Edge');
    return false;
  }
  try {
    const handle = await window.showSaveFilePicker({
      suggestedName: DATA_FILE_NAME,
      types: [{ description: 'JSON 数据文件', accept: { 'application/json': ['.json'] } }]
    });
    const writable = await handle.createWritable();
    await writable.write(JSON.stringify(dataObj, null, 2));
    await writable.close();
    await storeFileHandle(handle);
    return true;
  } catch(e) {
    if (e.name !== 'AbortError') alert('设置失败：' + e.message);
    return false;
  }
}

        if (!raw) return false;
        const session = JSON.parse(raw);
        const now = Date.now();
        if (session.expiresAt && now < session.expiresAt) {
          currentUser.value = session.user;
          isLoggedIn.value = true;
          _currentUsername = session.user.username;
          return true;
        }
        localStorage.removeItem(SESSION_KEY);
      } catch(e) {}
      return false;
    }

    async function handleLogin() {
      const { username, password } = loginForm.value;
      if (!username.trim() || !password.trim()) {
        loginError.value = '请输入账号和密码';
        return;
      }
      loginLoading.value = true;
      loginError.value = '';
      try {
        const { data, error } = await supabaseClient
          .from('users')
          .select('*')
          .eq('username', username.trim())
          .eq('password', password)
          .single();
        if (error || !data) {
          loginError.value = '账号或密码错误';
        } else {
          currentUser.value = { username: data.username, role: data.role || 'user' };
          isLoggedIn.value = true;
          _currentUsername = data.username;
          localStorage.setItem(SESSION_KEY, JSON.stringify({
            user: currentUser.value,
            expiresAt: Date.now() + 24 * 60 * 60 * 1000
          }));
          loadUsers();
        }
      } catch(e) {
        loginError.value = '登录失败，请检查网络连接';
      }
      loginLoading.value = false;
    }

    function handleLogout() {
      isLoggedIn.value = false;
      currentUser.value = null;
      _currentUsername = null;
      localStorage.removeItem(SESSION_KEY);
      loginForm.value = { username: '', password: '' };
      currentPage.value = 'ledger';
    }

    // ===== 账号管理函数 =====
    async function loadUsers() {
      accountLoading.value = true;
      try {
        let query = supabaseClient
          .from('users')
          .select('*')
          .order('created_at', { ascending: false });
        if (currentUser.value && currentUser.value.username !== 'admin') {
          // 普通老师：从Supabase层面只查自己的账号
          query = query.eq('username', currentUser.value.username);
        }
        // admin：查全部（无需额外过滤）
        const { data, error } = await query;
        if (!error) users.value = data || [];
      } catch(e) {}
      accountLoading.value = false;
    }

    function openAddAccount() {
      accountForm.value = { id: null, username: '', password: '', isNew: true };
      accountModal.value = true;
    }

    function openEditPassword(user) {
      if (user.username === 'admin' && currentUser.value && currentUser.value.username !== 'admin') {
        alert('无权限修改管理员密码');
        return;
      }
      accountForm.value = { id: user.id, username: user.username, password: '', isNew: false };
      accountModal.value = true;
    }

    async function saveAccount() {
      const { id, username, password, isNew } = accountForm.value;
      if (!username.trim() || !password.trim()) {
        alert('账号和密码不能为空');
        return;
      }
      try {
        if (isNew) {
          const { error } = await supabaseClient.from('users').insert({
            username: username.trim(),
            password: password,
            role: 'user'
          });
          if (error) { alert('创建失败：' + error.message); return; }
        } else {
          const { error } = await supabaseClient.from('users').update({
            password: password
          }).eq('id', id);
          if (error) { alert('修改失败：' + error.message); return; }
        }
        accountModal.value = false;
        await loadUsers();
      } catch(e) {
        alert('操作失败：' + e.message);
      }
    }

    async function deleteAccount(user) {
      if (user.username === 'admin') {
        alert('管理员账号不可删除');
        return;
      }
      const isSelfDelete = currentUser.value && user.username === currentUser.value.username;
      const confirmMsg = isSelfDelete
        ? `确定删除自己的账号「${user.username}」吗？删除后将退出登录，此操作不可恢复。`
        : `确定删除账号「${user.username}」吗？此操作不可恢复。`;
      if (!confirm(confirmMsg)) return;
      try {
        const { error } = await supabaseClient.from('users').delete().eq('id', user.id);
        if (error) { alert('删除失败：' + error.message); return; }
        if (isSelfDelete) {
          handleLogout();
        } else {
          await loadUsers();
        }
      } catch(e) {
        alert('删除失败：' + e.message);

          { id:'2024002', name:'李雨涵', gender:'女', birth:'2015-11-05', parent:'李强', phone:'13800002222', address:'翠竹苑5栋102', note:'Scratch一级在读', teacher: demoTeacher },
          { id:'2024003', name:'王浩然', gender:'男', birth:'2016-07-20', parent:'王建国', phone:'13800003333', address:'碧水湾2栋501', note:'', teacher: demoTeacher },

    // ==================== 提成管理 ====================
    const commissionMonth = ref(todayStr.value.slice(0,7));
    const commissionMonthLabel = computed(() => {
      const [y,m] = commissionMonth.value.split('-');
      return y + ' 年 ' + parseInt(m) + ' 月';
    });
    const prevCommissionMonth = () => {
      const [y,m] = commissionMonth.value.split('-').map(Number);
      const d = new Date(y, m-2, 1);
      commissionMonth.value = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
      drawCommissionChart();
    };
    const nextCommissionMonth = () => {
      const [y,m] = commissionMonth.value.split('-').map(Number);
      const d = new Date(y, m, 1);
      commissionMonth.value = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
      drawCommissionChart();
    };
    const goCurrentCommissionMonth = () => {
      commissionMonth.value = todayStr.value.slice(0,7);
      drawCommissionChart();
    };

    // 体验课提成
    const trialMonthRecords = computed(() =>
      teacherData.value.trialCommissions.filter(r => r.month === commissionMonth.value)
    );
    const trialMonthTotal = computed(() =>
      trialMonthRecords.value.reduce((s,r) => s + r.commissionAmount, 0)
    );
    const trialAllTotal = computed(() =>
      teacherData.value.trialCommissions.reduce((s,r) => s + r.commissionAmount, 0)
    );

    // 新招或续费提成
    const enrollmentMonthRecords = computed(() =>
      teacherData.value.enrollmentCommissions.filter(r => r.month === commissionMonth.value)
    );
    const enrollmentMonthTotal = computed(() =>
      enrollmentMonthRecords.value.reduce((s,r) => s + r.commissionAmount, 0)
    );
    const enrollmentAllTotal = computed(() =>
      teacherData.value.enrollmentCommissions.reduce((s,r) => s + r.commissionAmount, 0)
    );

    // 全部合并
    const allCommissionRecords = computed(() =>
      [...teacherData.value.trialCommissions, ...teacherData.value.enrollmentCommissions]
    );
    const allCommissionMonthRecords = computed(() =>
      allCommissionRecords.value.filter(r => r.month === commissionMonth.value)
    );
    const allCommissionTotal = computed(() =>
      allCommissionRecords.value.reduce((s,r) => s + r.commissionAmount, 0)
    );
    const allCommissionMonthTotal = computed(() =>
      allCommissionMonthRecords.value.reduce((s,r) => s + r.commissionAmount, 0)
    );

    // 详情弹窗
    const commDetail = ref({ show:false, title:'', records:[] });
    const openCommissionDetail = (type, scope) => {
      let records = [];
      let title = '';
      if (type === 'trial') {
        records = scope === 'month' ? trialMonthRecords.value : teacherData.value.trialCommissions;
        title = (scope === 'month' ? commissionMonthLabel.value + ' ' : '') + '体验课提成';
      } else if (type === 'enrollment') {
        records = scope === 'month' ? enrollmentMonthRecords.value : teacherData.value.enrollmentCommissions;
        title = (scope === 'month' ? commissionMonthLabel.value + ' ' : '') + '新招/续费提成';
      } else {
        records = scope === 'month' ? allCommissionMonthRecords.value : allCommissionRecords.value;
        title = (scope === 'month' ? commissionMonthLabel.value + ' ' : '') + '全部提成';
      }
      commDetail.value = { show:true, title, records };
    };

    // 编辑弹窗
    const commEdit = ref({ show:false, id:null, type:'trial', recordType:'trial', month:'', studentName:'', packageAmount:0, commissionAmount:0 });
    const genCommId = () => 'cm_' + Date.now() + '_' + Math.random().toString(36).slice(2,6);

    const openCommissionEdit = (type) => {
      const m = commissionMonth.value;
      commEdit.value = { show:true, id:null, type, recordType: type==='all'?'trial':type, month:m, studentName:'', packageAmount:0, commissionAmount:0 };
    };
    const editCommissionFromDetail = (r) => {
      commEdit.value = { show:true, id:r.id, type:r.type, recordType:r.type, month:r.month, studentName:r.studentName, packageAmount:r.packageAmount, commissionAmount:r.commissionAmount };
    };
    const saveCommission = () => {
      const e = commEdit.value;
      if (!e.studentName.trim()) { alert('请输入学生姓名'); return; }
      if (!e.month) { alert('请选择月份'); return; }
      const actualType = e.type === 'all' ? e.recordType : e.type;
      const key = actualType === 'trial' ? 'trialCommissions' : 'enrollmentCommissions';
      if (e.id) {
        const arr = data.value[key];
        const idx = arr.findIndex(r => r.id === e.id);
        if (idx !== -1) {
          arr[idx] = { ...arr[idx], month:e.month, studentName:e.studentName.trim(), packageAmount:e.packageAmount||0, commissionAmount:e.commissionAmount||0 };
        }
      } else {
        data.value[key].push({
          id: genCommId(), type: actualType,
          month: e.month, studentName: e.studentName.trim(),
          packageAmount: e.packageAmount || 0, commissionAmount: e.commissionAmount || 0,
          teacher: currentUser.value?.username || ''
        });
      }
      saveDataToFile(data.value);
      commEdit.value.show = false;
      drawCommissionChart();
    };
    const deleteCommission = (id) => {
      if (!confirm('确定删除该条提成记录吗？')) return;
      let found = false;
      for (const key of ['trialCommissions','enrollmentCommissions']) {
        const idx = data.value[key].findIndex(r => r.id === id);
        if (idx !== -1) { data.value[key].splice(idx,1); found = true; break; }
      }
      if (found) {
        saveDataToFile(data.value);
        // 刷新详情弹窗
        if (commDetail.value.show) {
          commDetail.value.records = commDetail.value.records.filter(r => r.id !== id);
        }
        drawCommissionChart();
      }
    };

    // 图表
    const commissionChartRef = ref(null);
    const drawCommissionChart = () => {
      if (!commissionChartRef.value) return;
      const canvas = commissionChartRef.value;
      const ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.parentElement.getBoundingClientRect();
      const w = rect.width - 24;
      const h = 200;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      ctx.scale(dpr, dpr);

      // 汇总每月提成
      const all = [...teacherData.value.trialCommissions, ...teacherData.value.enrollmentCommissions];
      const monthMap = {};
      all.forEach(r => { monthMap[r.month] = (monthMap[r.month]||0) + r.commissionAmount; });
      let months = Object.keys(monthMap).sort();
      if (months.length === 0) {
        ctx.clearRect(0,0,w,h);
        ctx.fillStyle = '#999';
        ctx.font = '13px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('暂无提成数据', w/2, h/2);
        return;
      }
      // 最近6个月
      if (months.length > 6) months = months.slice(-6);
      const values = months.map(m => monthMap[m]);
      const maxVal = Math.max(...values, 1);

      ctx.clearRect(0,0,w,h);
      const pad = { top:20, right:20, bottom:30, left:45 };
      const chartW = w - pad.left - pad.right;
      const chartH = h - pad.top - pad.bottom;
      const barW = Math.min(chartW / months.length * 0.65, 50);
      const gap = chartW / months.length;

      // 渐变背景
      const grad = ctx.createLinearGradient(0, pad.top, 0, h - pad.bottom);
      grad.addColorStop(0, '#4A90E2');
      grad.addColorStop(1, '#7B68EE');

      months.forEach((m, i) => {
        const val = values[i];
        const barH = (val / maxVal) * chartH;
        const x = pad.left + i * gap + (gap - barW) / 2;
        const y = pad.top + chartH - barH;
        // 圆角柱状
        const r = 4;
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(x+r, y);
        ctx.lineTo(x+barW-r, y);
        ctx.quadraticCurveTo(x+barW, y, x+barW, y+r);
        ctx.lineTo(x+barW, y+barH);
        ctx.lineTo(x, y+barH);
        ctx.lineTo(x, y+r);
        ctx.quadraticCurveTo(x, y, x+r, y);
        ctx.fill();

        // 数值标签
        ctx.fillStyle = '#333';
        ctx.font = '11px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('¥' + val, x + barW/2, y - 5);

        // X轴标签
        ctx.fillStyle = '#666';
        ctx.font = '10px sans-serif';
        const [yy, mm] = m.split('-');
        ctx.fillText(yy.slice(2) + '/' + mm, x + barW/2, h - pad.bottom + 16);
      });

      // Y轴
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;
      for (let i = 0; i <= 3; i++) {
        const yPos = pad.top + chartH * (1 - i/3);
        ctx.beginPath();
        ctx.moveTo(pad.left, yPos);
        ctx.lineTo(w - pad.right, yPos);
        ctx.stroke();
        ctx.fillStyle = '#999';
        ctx.font = '10px sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText('¥' + Math.round(maxVal * i / 3), pad.left - 6, yPos + 3);
      }
    };

    // 切换页面时重绘图表
    watch(currentPage, (v) => {
      if (v === 'commission') {
        setTimeout(drawCommissionChart, 100);
      }
    });

    // 设置/更换数据文件
    const setupDataFileHandler = async () => {
      const ok = await setupDataFile(data.value);
      if (ok) { dataFromFile.value = true; alert('已设置数据文件，后续修改将自动同步'); }
    };

    // 导出备份（下载 JSON 文件）
    const exportData = () => {
      const json = JSON.stringify(data.value, null, 2);
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = '教师工作台备份_' + new Date().toISOString().slice(0,10) + '.json';
      a.click();
      URL.revokeObjectURL(url);
    };

    return {
      sidebarCollapsed, currentPage, studentTab, viewMode,
      navItems, courseTypes, subjects,
      todayStr, weekdayStr, currentMonth, currentNav,
      data, teacherData, dataFromFile,
      rosterSearch, rosterGenderFilter, rosterSort,
      modalCourse, modalCourseEdit, editingCourse,
      modalMeal, modalMealEdit, editingMeal, mealsByViewMonth, mealViewMonthTotal,
      modalReimburse, modalReimburseEdit, editingReimburse, reimburseViewMonthTotal, reimbursementsByViewMonth,
      modalRosterEdit, editingRoster,

      modalStudentDetail, detailStudentName, studentDetailData, openStudentDetail,
      newCourseInputs, addStudentCourse, deleteStudentCourse,
      courseViewDate, courseViewDateLabel,
      prevCourseViewDate, nextCourseViewDate, goTodayCourseView,
      getCoursesByViewDate, getCourseCountByDate, openCourseDetail, addCourse, editCourse, saveCourse, deleteCourse,
      reimburseViewYear, reimburseViewMonthNum, reimburseMonthLabel,
      prevReimburseMonth, nextReimburseMonth, goCurrentReimburseMonth,
      openMealDetail, addMeal, editMeal, saveMeal, deleteMeal,
      openReimburseDetail, addReimburse, editReimburse, saveReimburse, deleteReimburse,
      filteredRoster, openRosterAdd, openRosterEdit, saveRoster, deleteRoster,
      getSubjectProgress, getSubjectLevels, getProgressBySubjectLevel, getSubjectStudentCount,
      openProgressEditForSubject, openProgressAdd, addProgressForSubject, editProgress, saveProgress, deleteProgress,
      timeBlocks, weekDays, weekLabel, getCoursesByDateBlock, getCourseTypeLabel,
      prevWeek, nextWeek, goCurrentWeek, addCourseFromSchedule,
      statsMonthLabel, modalMonthStats, monthlyCoursesForStats, monthlyStudentDetails,
      monthlyStudentCount, monthlyStatsSummary,
      prevStatsMonth, nextStatsMonth, goCurrentStatsMonth, openMonthStats, addCourseFromMonthStats,
      // Todo清单
      todoInput, todoFilterKey, todoFilters, filteredTodos, todoDateLabel,
      activeTodoCount, completedTodoCount, editingTodoId, editTodoText,
      addTodo, toggleTodo, startEditTodo, saveEditTodo, cancelEditTodo, deleteTodo, clearCompletedTodos,
      // 提成管理
      commissionMonth, commissionMonthLabel, prevCommissionMonth, nextCommissionMonth, goCurrentCommissionMonth,
      trialMonthRecords, trialMonthTotal, trialAllTotal,
      enrollmentMonthRecords, enrollmentMonthTotal, enrollmentAllTotal,
      allCommissionRecords, allCommissionMonthRecords, allCommissionTotal, allCommissionMonthTotal,
      commDetail, openCommissionDetail, commEdit, openCommissionEdit, editCommissionFromDetail, saveCommission, deleteCommission,
      commissionChartRef,
      // 数据文件管理
      dataFromFile, setupDataFileHandler, exportData,
      // 登录认证
      isLoggedIn, currentUser, loginForm, loginError, loginLoading, handleLogin, handleLogout,
      // 账号管理
      users, filteredUsers, accountModal, accountForm, accountLoading, loadUsers, openAddAccount, openEditPassword, saveAccount, deleteAccount,
    };
  }
}).mount('#app');
document.getElementById('loading').style.display='none';
